services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agents-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agents-db:
